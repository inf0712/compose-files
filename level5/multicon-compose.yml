services:
  frontend:
   image: nginx
   container_name: emp_frontend
   ports:
     - "8084:80"
   networks:
     - emp-network
   depends_on:
     -  backend
   volumes:
    - ./frontend:/usr/share/nginx/html
    - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
   build:
     context: ./backend
     dockerfile: Dockerfile
   container_name: emp_backend
   env_file:
     - .env
   expose:
     - "3000"
   networks:
     - emp-network
   depends_on:
     db:
       condition: service_healthy


  db:
   image: postgres:16-alpine
   container_name: emp-db
   expose:
     - "5432"
   environment:
     POSTGRES_DB: dbkiller
     POSTGRES_USER: admin
     POSTGRES_PASSWORD: 2886
   volumes:
     - postgres-data:/var/lib/postgresql/data
   networks:
     - emp-network

   healthcheck:
    test: ["CMD", "pg_isready", "-U", "admin", "-d", "dbkiller"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s


networks:
  emp-network:
    driver: bridge

volumes:
  postgres-data:
