services:
 frontend:
   image: nginx
   container_name: level4_frontend
   ports:
     - "8083:80"
   networks:
     - app-network
   depends_on:
     - backend

 backend:
   image: node:20-alpine
   container_name: level4_backend
   expose:
     - "3000"
   networks:
     - app-network

networks:
  app-network:
    driver: bridge
